name: Configurator

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/App/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'src/App/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish release app-v<version> (version read from AssemblyInfo.cs)'
        type: boolean
        default: false
        required: false

concurrency:
  group: configurator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short: ${{ steps.version.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      # .NET 10 SDK for the net10.0-windows target. PackageReference restore
      # is implicit in `dotnet build`; no separate NuGet/MSBuild setup needed.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The app project transitively builds GithubUpdater and HexHelper.
      - name: Build
        run: dotnet build src/App/Fcc3_configurator/FCC_configurator.csproj -c Release

      - name: Read app version
        id: version
        run: |
          $match = Select-String -Path 'src\App\Fcc3_configurator\Properties\AssemblyInfo.cs' -Pattern '^\[assembly: AssemblyVersion\("(\d+(?:\.\d+)*)"\)'
          if (-not $match) {
            Write-Error 'Could not read AssemblyVersion from AssemblyInfo.cs'
            exit 1
          }
          $version = $match.Matches[0].Groups[1].Value
          $short = ($version -split '\.')[0..2] -join '.'
          "version=$version" >> $env:GITHUB_OUTPUT
          "short=$short"     >> $env:GITHUB_OUTPUT
          "App version: $version"

      # Portable layout: SDK-style framework-dependent output (app dll/exe +
      # deps/runtimeconfig) copied out of bin\Release\net10.0-windows, plus the
      # Avrdude helper folder next to the exe (HexUpdater resolves "Avrdude"
      # relative to the application directory).
      - name: Stage portable bundle
        run: |
          $bundle = 'dist\configurator'
          New-Item -ItemType Directory -Force -Path $bundle, "$bundle\Avrdude" | Out-Null
          Copy-Item 'src\App\Fcc3_configurator\bin\Release\net10.0-windows\*' $bundle -Force
          Copy-Item 'src\App\HexUploader\Avrdude\*' "$bundle\Avrdude" -Force
          Get-ChildItem $bundle -Recurse

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: configurator-${{ steps.version.outputs.short }}
          path: dist/configurator/
          if-no-files-found: error

  release:
    name: Build MSI and publish app release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download portable bundle
        uses: actions/download-artifact@v4
        with:
          name: configurator-${{ needs.build.outputs.short }}
          path: dist\bundle

      - name: Zip portable bundle
        env:
          VERSION: ${{ needs.build.outputs.short }}
        run: |
          Compress-Archive -Path 'dist\bundle\*' -DestinationPath "dist\fcc_controller_${VERSION}.zip" -Force
          Get-ChildItem dist

      # PENDING MO4/MO5: the SDK project has no Publish configuration (the old
      # vdproj referenced obj\Publish\FCC_configurator.exe); build Release only.
      # MO4 aligns the vdproj output paths with bin\Release\net10.0-windows\ and
      # MO5 finalizes this workflow.
      - name: Build app (Release, for installer)
        continue-on-error: true
        run: dotnet build src/App/Fcc3_configurator/FCC_configurator.csproj -c Release

      # PENDING MO4/MO5: the vdproj/MSI steps below are unchanged from the net48
      # pipeline and still target the old output paths; MO4 aligns them with the
      # SDK output and MO5 finalizes this workflow.
      # devenv refuses out-of-process .vdproj builds until DisableOutOfProcBuild
      # unlocks the registry; the tool must run from its own directory.
      - name: Enable out-of-process installer builds
        continue-on-error: true
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $tool = Join-Path $vsPath 'Common7\IDE\PrivateAssemblies\DisableOutOfProcBuild.exe'
          if (Test-Path $tool) {
            Push-Location (Split-Path $tool -Parent)
            cmd /c DisableOutOfProcBuild.exe
            Pop-Location
          } else {
            Write-Warning "DisableOutOfProcBuild.exe not found under $vsPath"
          }

      # devenv needs absolute paths (VS2022 rejects relative ones) and
      # devenv.com (devenv.exe returns no useful output on the command line).
      # The runner image has the VS Installer Projects extension preinstalled,
      # so the .vdproj can be built without VS being manually installed.
      - name: Build installer
        continue-on-error: true
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $devenv = Join-Path $vsPath 'Common7\IDE\devenv.com'
          & $devenv (Join-Path $PWD 'src\App\Fcc3_configurator.sln') /Build 'Release|Any CPU' /Project (Join-Path $PWD 'src\App\WindowsInstaller\WindowsInstaller.vdproj') /Out devenv.log
          Get-Content devenv.log
          exit $LASTEXITCODE

      - name: Stage MSI
        continue-on-error: true
        env:
          VERSION: ${{ needs.build.outputs.short }}
        run: |
          $msi = Get-ChildItem src\App -Recurse -Filter Fcc3Controller.msi | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "dist\fcc_controller_${VERSION}.msi" -Force
            "Found MSI at $($msi.FullName)"
          } else {
            Write-Warning 'No Fcc3Controller.msi produced; the release will ship the portable zip only'
          }

      # Carry the firmware assets forward from the newest release that has them,
      # so GithubUpdater always finds both a .hex and a .msi in the latest
      # release even though only the app was rebuilt for this tag.
      - name: Reuse firmware assets from previous release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq 'first(.[] | select(any(.assets[].name; endswith(".hex"))) | .tag_name)'
          if ($tag) {
            gh release download $tag --dir dist --pattern '*.hex' --pattern '*.eep' --pattern '*.elf' --pattern '*.srec' --pattern '*.map' --pattern '*.lss'
            "Firmware assets reused from previous release: $tag"
          } else {
            Write-Warning 'No previous release with firmware (.hex) assets found'
          }

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: app-v${{ needs.build.outputs.short }}
        run: |
          if (-not (gh release view $env:TAG)) {
            gh release create $env:TAG --target $env:GITHUB_SHA --title $env:TAG --generate-notes
            if (-not (gh release view $env:TAG)) {
              Write-Error 'Release does not exist and could not be created'
              exit 1
            }
          }
          gh release upload $env:TAG dist\* --clobber
          gh release view $env:TAG --json assets --jq '.assets[].name'
