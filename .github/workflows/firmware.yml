name: Firmware

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-avr avr-libc binutils-avr make

      - name: Build
        working-directory: src/Controller/Fcc3
        run: make -j"$(nproc)"

      - name: Read firmware version
        id: version
        working-directory: src/Controller/Fcc3
        run: |
          version=$(grep -oP 'ReleaseNumber\s*=\s*VERSION_BCD\(\K[0-9]+,[0-9]+,[0-9]+' Descriptors.c | tr ',' '.')
          if [ -z "$version" ]; then
            echo "::error::Could not read ReleaseNumber from Descriptors.c"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $version"

      - name: Stage release assets
        working-directory: src/Controller/Fcc3
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp build/Fcc3.hex  "dist/fcc_controller_${VERSION}.hex"
          cp build/Fcc3.eep  "dist/fcc_controller_${VERSION}.eep"
          cp build/Fcc3.elf  "dist/fcc_controller_${VERSION}.elf"
          cp build/Fcc3.srec "dist/fcc_controller_${VERSION}.srec"
          cp build/Fcc3.map  "dist/fcc_controller_${VERSION}.map"
          cp build/Fcc3.lss  "dist/fcc_controller_${VERSION}.lss"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.version }}
          path: src/Controller/Fcc3/dist/*
          if-no-files-found: error

  release:
    name: Attach firmware to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
